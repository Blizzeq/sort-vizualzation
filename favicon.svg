<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="32" height="32" fill="#f8fafc" rx="4"/>
  
  <!-- Sorting bars representing different heights -->
  <rect x="4" y="20" width="4" height="8" fill="url(#grad1)" rx="1"/>
  <rect x="10" y="12" width="4" height="16" fill="url(#grad2)" rx="1"/>
  <rect x="16" y="8" width="4" height="20" fill="url(#grad3)" rx="1"/>
  <rect x="22" y="16" width="4" height="12" fill="url(#grad4)" rx="1"/>
  
  <!-- Subtle border -->
  <rect width="32" height="32" fill="none" stroke="#e2e8f0" stroke-width="1" rx="4"/>
</svg>